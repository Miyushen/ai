services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insight
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_USE_RESPONSES_API: ${OPENAI_USE_RESPONSES_API:-true}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_VERBOSITY: ${OPENAI_VERBOSITY:-}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-0}
      DATABASE_URL: postgresql+psycopg://insight:insight@db:5432/insight
      MAX_SQL_ROWS: ${MAX_SQL_ROWS:-200}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-10000}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-2}
      MODEL_NODE_MAX_ATTEMPTS: ${MODEL_NODE_MAX_ATTEMPTS:-3}
    command: >-
      sh -c "python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts

  ui:
    build: .
    environment:
      API_BASE_URL: http://api:8000
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  postgres_data:

